# Configuración de Netlify

[build]
  publish = "/"
  command = "echo 'Sitio estático listo'"

# Headers para mejor rendimiento
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
