[build]
  command = "cd client && npm install && npm run build && cd .. && mkdir -p admin && cp -r client/dist/* admin/"
  publish = "."

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Environment variables para el API
[build.environment]
  VITE_API_URL = "https://serverbackend-8zzp.onrender.com"

